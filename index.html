<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Dashboard</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fc;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Styling */
        header {
            text-align: center;
            padding: 20px 0;
            flex-shrink: 0;
        }

        header h1 {
            color: #1e1e4b;
            font-size: 24px;
            font-weight: 800;
            display: inline-block;
        }

        header h1 span {
            color: #6358e1;
        }

        /* Main Layout */
        .app-container {
            display: flex;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px 20px 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* Left Panel - My Tasks */
        .left-panel {
            flex: 0 0 45%;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .panel-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-title-group h2 {
            font-size: 20px;
            color: #1e1e4b;
        }

        .badge-total {
            background-color: #f0f0ff;
            color: #6358e1;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
        }

        /* Input Area */
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
        }

        .input-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .input-controls input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-controls input:focus {
            border-color: #6358e1;
        }

        .input-controls button {
            background-color: #6358e1;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
        }

        .input-controls button:hover {
            background-color: #5146c9;
        }

        /* List Headers */
        .list-headers {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .list-headers span {
            font-size: 11px;
            color: #a0a0a0;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .list-headers .right-headers span {
            margin-left: 20px;
        }

        /* Task List Container */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        /* Task Line Item */
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 5px solid transparent;
        }

        .task-item-name {
            font-weight: 500;
            font-size: 14px;
            color: #333;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 15px;
        }

        .task-item-controls {
            display: flex;
            gap: 10px;
        }

        .task-item select {
            padding: 6px 8px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background-color: #fff;
            font-size: 12px;
            color: #555;
            outline: none;
            cursor: pointer;
        }

        /* Right Panel - Boards Grid */
        .right-panel {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            overflow-y: auto;
        }

        .board {
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .board-header h3 {
            font-size: 16px;
            color: #333;
        }

        .board-badge {
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .board-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .board-card {
            background-color: rgba(255, 255, 255, 0.5);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            color: #444;
        }

        .board-card .priority-label {
            color: #666;
            font-size: 12px;
        }

        .empty-text {
            color: #888;
            font-size: 13px;
            margin-top: 10px;
        }

        /* Color Themes for Statuses */
        /* Not Started */
        .theme-not-started { background-color: #fff3cd; }
        .border-not-started { border-left-color: #ffc107; }
        
        /* Running */
        .theme-running { background-color: #cff4fc; }
        .border-running { border-left-color: #0dcaf0; }
        
        /* Completed */
        .theme-completed { background-color: #d1e7dd; }
        .border-completed { border-left-color: #198754; }
        
        /* Cancelled */
        .theme-cancelled { background-color: #f8d7da; }
        .border-cancelled { border-left-color: #dc3545; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        /* Responsive */
        @media (max-width: 900px) {
            .app-container { flex-direction: column; overflow-y: auto; }
            .left-panel, .right-panel { flex: none; width: 100%; overflow-y: visible; }
            body { overflow-y: auto; }
        }
        @media (max-width: 600px) {
            .right-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>To-do List</h1>
    </header>

    <div class="app-container">
        
        <!-- Left Column: Input and List -->
        <section class="left-panel">
            <div class="panel-header">
                <div class="panel-title-group">
                    <h2>My tasks</h2>
                    <span class="badge-total" id="total-badge">0</span>
                </div>
                <div class="subtitle">One thing at a time</div>
            </div>

            <div class="input-group">
                <label for="task-input">What's on your list?</label>
                <div class="input-controls">
                    <input type="text" id="task-input" placeholder="e.g. Read a chapter..." autocomplete="off">
                    <button id="add-btn">+ Add task</button>
                </div>
            </div>

            <div class="list-headers">
                <span>Your to-do lineup</span>
                <div class="right-headers">
                    <span>Status</span>
                    <span>Priority</span>
                </div>
            </div>

            <div class="task-list" id="task-list">
                <!-- Task list items will be appended here by jQuery -->
            </div>
        </section>

        <!-- Right Column: Status Boards -->
        <section class="right-panel">
            <!-- Not Started Board -->
            <div class="board theme-not-started">
                <div class="board-header">
                    <h3>Not Started</h3>
                    <span class="board-badge" id="badge-not-started">0</span>
                </div>
                <div class="board-items" id="board-not-started"></div>
            </div>

            <!-- Completed Board -->
            <div class="board theme-completed">
                <div class="board-header">
                    <h3>Completed</h3>
                    <span class="board-badge" id="badge-completed">0</span>
                </div>
                <div class="board-items" id="board-completed"></div>
            </div>

            <!-- Running Board -->
            <div class="board theme-running">
                <div class="board-header">
                    <h3>Running</h3>
                    <span class="board-badge" id="badge-running">0</span>
                </div>
                <div class="board-items" id="board-running"></div>
            </div>

            <!-- Cancelled Board -->
            <div class="board theme-cancelled">
                <div class="board-header">
                    <h3>Cancelled</h3>
                    <span class="board-badge" id="badge-cancelled">0</span>
                </div>
                <div class="board-items" id="board-cancelled"></div>
            </div>
        </section>

    </div>

    <script>
        $(document).ready(function() {
            // CRITICAL REQUIREMENT: Empty state initially (0 tasks)
            let tasks = [];
            
            const STATUSES = ['Not Started', 'Running', 'Completed', 'Cancelled'];
            const PRIORITIES = ['Low', 'Moderate', 'High'];

            // Mapping statuses to their respective CSS class names
            const statusConfig = {
                'Not Started': { theme: 'theme-not-started', border: 'border-not-started', boardId: '#board-not-started', badgeId: '#badge-not-started' },
                'Running': { theme: 'theme-running', border: 'border-running', boardId: '#board-running', badgeId: '#badge-running' },
                'Completed': { theme: 'theme-completed', border: 'border-completed', boardId: '#board-completed', badgeId: '#badge-completed' },
                'Cancelled': { theme: 'theme-cancelled', border: 'border-cancelled', boardId: '#board-cancelled', badgeId: '#badge-cancelled' }
            };

            // Initialize App
            function render() {
                renderList();
                renderBoards();
                updateBadges();
            }

            function renderList() {
                const $taskList = $('#task-list');
                $taskList.empty(); // Clear existing

                if (tasks.length === 0) {
                    $taskList.append('<div class="empty-text" style="text-align: center; margin-top: 20px;">Your task lineup is empty.</div>');
                    return;
                }

                tasks.forEach(task => {
                    const config = statusConfig[task.status];
                    
                    // Generate options for dropdowns
                    let statusOptions = STATUSES.map(s => `<option value="${s}" ${s === task.status ? 'selected' : ''}>${s}</option>`).join('');
                    let priorityOptions = PRIORITIES.map(p => `<option value="${p}" ${p === task.priority ? 'selected' : ''}>${p}</option>`).join('');

                    const taskHtml = `
                        <div class="task-item ${config.theme} ${config.border}" data-id="${task.id}">
                            <div class="task-item-name">${escapeHtml(task.name)}</div>
                            <div class="task-item-controls">
                                <select class="status-select">${statusOptions}</select>
                                <select class="priority-select">${priorityOptions}</select>
                            </div>
                        </div>
                    `;
                    $taskList.append(taskHtml);
                });
            }

            function renderBoards() {
                // Clear all board items
                $('.board-items').empty();

                // Track counts to handle empty states per board
                let boardCounts = { 'Not Started': 0, 'Running': 0, 'Completed': 0, 'Cancelled': 0 };

                tasks.forEach(task => {
                    const config = statusConfig[task.status];
                    boardCounts[task.status]++;
                    
                    const cardHtml = `
                        <div class="board-card">
                            <span>${escapeHtml(task.name)}</span>
                            <span class="priority-label">&middot; ${task.priority}</span>
                        </div>
                    `;
                    $(config.boardId).append(cardHtml);
                });

                // Inject empty text if a board has 0 tasks
                STATUSES.forEach(status => {
                    if (boardCounts[status] === 0) {
                        $(statusConfig[status].boardId).append('<div class="empty-text">No tasks here yet</div>');
                    }
                });
            }

            function updateBadges() {
                // Total tasks
                $('#total-badge').text(tasks.length);

                // Per-board counts
                let boardCounts = { 'Not Started': 0, 'Running': 0, 'Completed': 0, 'Cancelled': 0 };
                tasks.forEach(task => boardCounts[task.status]++);

                STATUSES.forEach(status => {
                    $(statusConfig[status].badgeId).text(boardCounts[status]);
                });
            }

            
            // Add Task
            function handleAddTask() {
                const name = $('#task-input').val().trim();
                if (!name) return; // Prevent empty tasks

                const newId = tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
                
                tasks.push({
                    id: newId,
                    name: name,
                    status: 'Not Started', // Default status
                    priority: 'Moderate'   // Default priority
                });

                $('#task-input').val(''); // Clear input
                render();
                
                // Auto-scroll the list to bottom
                const list = $('#task-list')[0];
                list.scrollTop = list.scrollHeight;
            }

            $('#add-btn').on('click', handleAddTask);
            
            $('#task-input').on('keypress', function(e) {
                if (e.which === 13) handleAddTask();
            });

            // Handle Dropdown Changes (Event Delegation)
            $('#task-list').on('change', '.status-select', function() {
                const taskId = $(this).closest('.task-item').data('id');
                const newStatus = $(this).val();
                updateTask(taskId, 'status', newStatus);
            });

            $('#task-list').on('change', '.priority-select', function() {
                const taskId = $(this).closest('.task-item').data('id');
                const newPriority = $(this).val();
                updateTask(taskId, 'priority', newPriority);
            });

            function updateTask(id, field, value) {
                const index = tasks.findIndex(t => t.id === id);
                if (index !== -1) {
                    tasks[index][field] = value;
                    render(); // Re-render everything with new state
                }
            }

            // Utility to prevent XSS in inputs
            function escapeHtml(unsafe) {
                return (unsafe || '').toString()
                     .replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;")
                     .replace(/'/g, "&#039;");
            }

            // Initial Render (will display empty states)
            render();
        });
    </script>
</body>
</html>
